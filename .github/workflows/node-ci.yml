name: node-ci

# Reusable. Call it from any Node repo:
#
#   jobs:
#     ci:
#       uses: joeyheath65/standards/.github/workflows/node-ci.yml@v1
#       with:
#         package-manager: pnpm
#
# Node version comes from the repo's .nvmrc - never hardcoded here, so the
# pin lives in exactly one place per repo and baseline-check can police it.

on:
  workflow_call:
    inputs:
      package-manager:
        description: npm or pnpm
        type: string
        default: npm
      working-directory:
        type: string
        default: .
      test-command:
        type: string
        default: ''
      skip-typecheck:
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      # Not every repo has every script, and a missing lint script must not
      # read as a failing lint. `--if-present` is NOT the way to do this:
      # npm parses the flag anywhere, but pnpm treats it as an argument TO the
      # script and dies with ERR_PNPM_NO_SCRIPT. So test package.json directly
      # - one behaviour, both package managers, and the log says which it did.
      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            ${{ inputs.package-manager }} run lint
          else
            echo "no lint script — skipped"
          fi

      - name: Typecheck
        if: ${{ !inputs.skip-typecheck }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            ${{ inputs.package-manager }} run typecheck
          else
            echo "no typecheck script — skipped"
          fi

      # test-command goes through `env`, not `${{ }}` interpolation. Inlining an
      # empty input leaves an empty `then` branch, which is a bash syntax error
      # - and interpolating caller-supplied text straight into a shell is how
      # you get an injection besides.
      - name: Test
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: |
          if [ -n "$TEST_CMD" ]; then
            eval "$TEST_CMD"
          elif node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            ${{ inputs.package-manager }} run test
          else
            echo "no test script — skipped"
          fi

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            ${{ inputs.package-manager }} run build
          else
            echo "no build script — skipped"
          fi
