name: python-ci

# Reusable. Call it from any Python repo:
#
#   jobs:
#     ci:
#       uses: joeyheath65/standards/.github/workflows/python-ci.yml@v1

on:
  workflow_call:
    inputs:
      python-version:
        description: Overrides .python-version when set.
        type: string
        default: ''
      working-directory:
        type: string
        default: .
      test-command:
        type: string
        default: python -m pytest -q

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          python-version-file: ${{ inputs.python-version == '' && '.python-version' || '' }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e '.[dev]' || pip install -e . || true; fi

      - name: Lint
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check .; else
            echo "ruff not installed - skipping lint"; fi

      - name: Test
        run: ${{ inputs.test-command }}
