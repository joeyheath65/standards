name: flutter-ci

# Reusable. Call it from any Flutter or Dart repo:
#
#   jobs:
#     ci:
#       uses: joeyheath65/standards/.github/workflows/flutter-ci.yml@v1
#
# The Flutter version comes from baseline.json (runtimes.flutter.target) so
# there is one number to change, same as Node. Passing `flutter-version`
# overrides it — use that only to pin a repo behind the baseline deliberately,
# and file the exception in .baseline.json so it expires.

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Overrides the baseline. Leave empty to track baseline.json.
        type: string
        default: ''
      channel:
        type: string
        default: stable
      working-directory:
        type: string
        default: .
      standards-ref:
        type: string
        default: v1
      run-tests:
        type: string
        description: "'false' skips the test step for a repo with no tests yet."
        default: 'true'
      analyze-fatal-infos:
        description: "'true' fails on info-level lints as well as warnings."
        type: string
        default: 'false'
      format-check:
        description: "'enforce' fails on formatting drift; 'report' (default) logs it and continues."
        type: string
        default: 'report'

      # --- cross-repo preset parity (opt-in) -----------------------------
      # A repo that vendors a copy of a contract file owned by a sibling repo
      # has no way to notice the day the two diverge. slotd-mobile carries
      # assets/verticalPresets.json; slotd-web owns the canonical copy and
      # enforces its own three internal copies with
      # scripts/check-preset-parity.mjs — a script that cannot see the mobile
      # fourth copy. This closes that hole.
      parity-repo:
        description: >-
          owner/repo holding the canonical files, e.g. joeyheath65/slotd-app.
          Empty (default) skips the whole check — and that skip is correct,
          because the repo has declared it has no sibling contract.
        type: string
        default: ''
      parity-ref:
        description: Branch or tag in parity-repo. Empty means its default branch.
        type: string
        default: ''
      parity-pairs:
        description: >-
          local:remote file pairs, separated by newlines or commas, e.g.
          assets/verticalPresets.json:functions/src/config/verticalPresets.json
        type: string
        default: ''
      parity-token-secret:
        description: >-
          Name of the secret holding a PAT with read access to parity-repo
          (needed when it is private). Requires the caller to pass
          `secrets: inherit`. Alternatively pass the token directly as the
          `parity-token` secret and leave this empty.
        type: string
        default: ''
    secrets:
      parity-token:
        description: >-
          The parity PAT, passed explicitly. Preferred over parity-token-secret
          because it does not require the caller to inherit every secret it has.
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the standards
        uses: actions/checkout@v7
        with:
          repository: joeyheath65/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards

      # One number, one place — but honour the repo's dated exception, exactly
      # like every other check. Building a repo against a Flutter it has not
      # migrated to resolves dependencies differently and fails
      # --enforce-lockfile on a lockfile that is perfectly valid for the
      # version the repo actually uses. That is a false failure, and a CI that
      # cries wolf gets muted.
      #
      # Order: explicit input > .baseline.json exception > baseline target.
      - name: Resolve the Flutter version
        id: ver
        run: |
          if [ -n "${{ inputs.flutter-version }}" ]; then
            v="${{ inputs.flutter-version }}"
            src="workflow input"
          else
            v=$(python3 - <<'PY'
          import json, os, pathlib
          std = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / ".standards" / "baseline.json"
          target = json.load(open(std))["runtimes"]["flutter"]["target"]
          cfg = pathlib.Path(".baseline.json")
          if cfg.is_file():
              exc = (json.loads(cfg.read_text()).get("exceptions") or {}).get("flutter")
              if exc and exc.get("floor"):
                  print(exc["floor"]); raise SystemExit
          print(target)
          PY
          )
            src="baseline (or its dated exception)"
          fi
          echo "Flutter $v — from $src"
          echo "flutter=$v" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.ver.outputs.flutter }}
          channel: ${{ inputs.channel }}
          cache: true

      - name: Versions
        run: |
          flutter --version
          dart --version

      # --frozen fails when pubspec.lock disagrees with pubspec.yaml. Same
      # class of defect as npm ci refusing an out-of-sync package-lock, and
      # it took down a deploy here once already.
      - name: Install
        run: flutter pub get --enforce-lockfile

      # Report-only by default. On slotd-mobile this step flagged drift that
      # does NOT reproduce locally on the same Dart 3.11.4 against the same
      # commit - so the discrepancy is real but not understood, and failing a
      # build on an unexplained check is how a gate loses credibility. Set
      # format-check: enforce once a repo is known clean in CI.
      - name: Format check
        run: |
          if [ "${{ inputs.format-check }}" = "enforce" ]; then
            dart format --output=none --set-exit-if-changed .
          else
            dart format --output=none --set-exit-if-changed . \
              || echo "::warning::formatting drift (report-only; set format-check: enforce to gate on it)"
          fi

      # `flutter analyze` treats INFO-level lints as fatal by default, so the
      # "non-strict" path has to say --no-fatal-infos explicitly. Without it,
      # a repo mid-deprecation fails CI on its own intentional @deprecated
      # annotations - which is what slotd-mobile did with 14 infos and zero
      # warnings or errors. Warnings and errors still fail either way.
      - name: Analyze
        run: |
          if [ "${{ inputs.analyze-fatal-infos }}" = "true" ]; then
            flutter analyze --fatal-infos
          else
            flutter analyze --no-fatal-infos
          fi

      - name: Test
        if: ${{ inputs.run-tests != 'false' }}
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' -print -quit)" ]; then
            flutter test
          else
            echo "no *_test.dart under test/ — skipped"
          fi

  # Separate job: it needs no Flutter, so it runs alongside `ci` and shows up
  # as its own check rather than hiding inside a green build.
  #
  # THE RULE THIS JOB EXISTS TO ENFORCE: the ONLY skip is an empty
  # `parity-repo`, which is the repo saying it has no sibling contract. Once
  # `parity-repo` is set, everything below is a HARD FAILURE — no token, an
  # unclonable repo, an empty pair list, a malformed pair, a missing file on
  # either side, or a single differing byte. It must NEVER degrade to a skip,
  # a warning, or `continue-on-error`. A silent no-op here reports green over
  # a copy nobody verified, which is precisely the drift this was built to
  # catch: the check would be worse than nothing, because it would look like
  # coverage.
  preset-parity:
    if: ${{ inputs.parity-repo != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      # Not `actions/checkout` with a token, because a missing-token failure
      # from that action reads as a generic 403 on a repo that "does not
      # exist". Say what is actually wrong instead.
      - name: Clone the canonical repo
        env:
          PARITY_REPO: ${{ inputs.parity-repo }}
          PARITY_REF: ${{ inputs.parity-ref }}
          TOKEN_NAME: ${{ inputs.parity-token-secret }}
          TOKEN_EXPLICIT: ${{ secrets.parity-token }}
          TOKEN_NAMED: ${{ secrets[inputs.parity-token-secret] }}
        run: |
          set -uo pipefail
          tok="${TOKEN_EXPLICIT:-$TOKEN_NAMED}"
          if [ -z "$tok" ]; then
            echo "::error::preset parity is enabled (parity-repo=$PARITY_REPO) but no token resolved."
            if [ -n "$TOKEN_NAME" ]; then
              echo "::error::parity-token-secret='$TOKEN_NAME' was empty. Does that secret exist, and did the caller pass 'secrets: inherit'?"
            else
              echo "::error::Pass the PAT as the 'parity-token' secret, or name it with parity-token-secret + 'secrets: inherit'."
            fi
            exit 1
          fi

          args=(--depth 1 --quiet)
          if [ -n "$PARITY_REF" ]; then
            args+=(--branch "$PARITY_REF")
          fi
          if ! git clone "${args[@]}" \
                 "https://x-access-token:${tok}@github.com/${PARITY_REPO}.git" \
                 "$GITHUB_WORKSPACE/.parity"; then
            echo "::error::could not clone $PARITY_REPO${PARITY_REF:+ (ref $PARITY_REF)}. Check the PAT's scope and that it can read that repo."
            exit 1
          fi
          echo "cloned $PARITY_REPO @ $(git -C "$GITHUB_WORKSPACE/.parity" rev-parse --short HEAD)"

      # BYTES, not parsed JSON. Byte-identical is the contract: slotd-web's
      # scripts/check-preset-parity.mjs assumes every copy is the same file,
      # so a reformat that preserves semantics still breaks it. Do not
      # "improve" this into a jq/json diff.
      - name: Compare the pairs byte for byte
        env:
          PAIRS: ${{ inputs.parity-pairs }}
          PARITY_REPO: ${{ inputs.parity-repo }}
        run: |
          set -uo pipefail
          sib="$GITHUB_WORKSPACE/.parity"

          mapfile -t entries < <(printf '%s\n' "$PAIRS" | tr ',' '\n')
          fail=0
          checked=0

          for raw in "${entries[@]}"; do
            entry="$(printf '%s' "$raw" | tr -d '[:space:]')"
            [ -z "$entry" ] && continue
            case "$entry" in
              *:*) ;;
              *) echo "::error::malformed parity pair '$entry' — expected local/path:remote/path"; fail=1; continue ;;
            esac
            here="${entry%%:*}"
            there="${entry#*:}"
            checked=$((checked + 1))

            if [ ! -f "$here" ]; then
              echo "::error::$here is missing in this repo (pair '$entry')"
              fail=1; continue
            fi
            if [ ! -f "$sib/$there" ]; then
              echo "::error::$there is missing in $PARITY_REPO (pair '$entry')"
              fail=1; continue
            fi

            if cmp -s "$here" "$sib/$there"; then
              echo "  ok  $here == $PARITY_REPO:$there  sha256 $(sha256sum "$here" | cut -c1-16)"
              continue
            fi

            fail=1
            echo "::error::preset parity: $here differs from $PARITY_REPO:$there"
            echo "        local  sha256 $(sha256sum "$here" | cut -d' ' -f1)  $(wc -c <"$here") bytes"
            echo "        canon  sha256 $(sha256sum "$sib/$there" | cut -d' ' -f1)  $(wc -c <"$sib/$there") bytes"
            echo "--- diff (canonical -> local) ---"
            diff -u --label "$PARITY_REPO/$there" "$sib/$there" --label "$here" "$here" | head -400
            echo "--- end diff ---"
            {
              echo "### preset parity FAILED"
              echo
              echo "\`$here\` differs from \`$PARITY_REPO:$there\`. Copy the canonical file over; do not hand-edit either side."
              echo
              echo '```diff'
              diff -u --label "$PARITY_REPO/$there" "$sib/$there" --label "$here" "$here" | head -200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

          # parity-repo was set, so the repo asked for this check. Zero pairs
          # means it is misconfigured, and passing would be the silent no-op
          # this job forbids.
          if [ "$checked" -eq 0 ]; then
            echo "::error::parity-repo is set but parity-pairs produced no usable pairs. Refusing to report green on an unverified copy."
            exit 1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "$checked pair(s) byte-identical to $PARITY_REPO"
