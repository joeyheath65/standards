name: renovate

# Self-hosted Renovate. Reusable — call it from any repo:
#
#   jobs:
#     renovate:
#       uses: joeyheath65/standards/.github/workflows/renovate.yml@v1
#
# Why self-hosted rather than the Mend-hosted GitHub App: this needs no
# third-party app granted access to the account, and no long-lived PAT stored
# as a secret. Each repo runs Renovate against ITSELF using the Actions
# GITHUB_TOKEN, which is already scoped to exactly that repo and expires with
# the job.
#
# THE TRADE-OFF, stated plainly: pull requests opened with GITHUB_TOKEN do NOT
# trigger other workflows. So a Renovate PR will not run `baseline` or `ci`
# automatically — you have to push a commit to it, close/reopen it, or click
# re-run. If that becomes annoying, the fix is a fine-grained PAT stored as
# RENOVATE_TOKEN; the `token` input below switches to it with no other change.
#
# The hosted App remains a one-click alternative at github.com/apps/renovate
# and does not have this limitation.

on:
  workflow_call:
    inputs:
      log-level:
        type: string
        default: info
      dry-run:
        description: Run without opening PRs. Use to preview what it would do.
        type: boolean
        default: false
    secrets:
      token:
        description: Optional PAT. Falls back to the job's GITHUB_TOKEN.
        required: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write        # the dependency dashboard is an issue
    steps:
      - uses: actions/checkout@v7

      - uses: renovatebot/github-action@v46.2.1
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'          # renovate.json already exists
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.log-level }}
        with:
          token: ${{ secrets.token || github.token }}
