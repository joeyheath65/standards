name: renovate

# Self-hosted Renovate. Reusable - call it from any repo:
#
#   jobs:
#     renovate:
#       uses: joeyheath65/standards/.github/workflows/renovate.yml@v1
#       secrets:
#         app-client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
#         app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
#
# Each repo runs Renovate against ITSELF. The token it runs with is picked in
# this order:
#
#   1. GitHub App. Pass `app-client-id` and `app-private-key` (both). The job
#      mints an installation token scoped to the calling repo only; it lasts
#      an hour and is revoked when the job ends. Pull requests are authored by
#      the App's bot user, so `baseline` and `ci` run on them.
#   2. PAT. Pass `token`. CI runs on the pull requests; the PAT is long-lived.
#   3. Neither. The job's GITHUB_TOKEN is used. Pull requests opened with
#      GITHUB_TOKEN do NOT trigger other workflows, so a Renovate PR gets no
#      checks until someone pushes to it, closes and reopens it, or re-runs.
#
# Passing only one of the two App secrets falls through to 2 or 3.
#
# The App is Joe's own, installed on his repos. It needs these repository
# permissions: Administration read, Checks read/write, Commit statuses
# read/write, Contents read/write, Dependabot alerts read, Issues read/write,
# Merge queues read/write, Metadata read, Pull requests read/write, Workflows
# read/write. `app-client-id` is the App's Client ID, not its App ID.

on:
  workflow_call:
    inputs:
      log-level:
        type: string
        default: info
      dry-run:
        description: "'full' previews without opening PRs; '' (default) runs for real."
        type: string
        default: ''
    secrets:
      app-client-id:
        description: Client ID of the Renovate GitHub App. Needs app-private-key too.
        required: false
      app-private-key:
        description: Private key (.pem contents) of the Renovate GitHub App.
        required: false
      token:
        description: Optional PAT, used when the App secrets are not both set.
        required: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write        # the dependency dashboard is an issue
    env:
      # A step `if:` cannot read secrets, so the check happens here.
      USE_APP: ${{ secrets.app-client-id != '' && secrets.app-private-key != '' }}
    steps:
      - uses: actions/checkout@v7

      - id: app-token
        if: env.USE_APP == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: renovatebot/github-action@v46.2.1
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'          # renovate.json already exists
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: ${{ inputs.dry-run }}
          LOG_LEVEL: ${{ inputs.log-level }}
        with:
          token: ${{ steps.app-token.outputs.token || secrets.token || github.token }}
